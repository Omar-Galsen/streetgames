<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetGames</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 30px 6%;
      background: #181818;
      border-bottom: 2px solid #333;
    }

    header h1 {
      font-size: 38px;
    }

    header p {
      margin-top: 8px;
      color: #aaa;
    }

    main {
      padding: 50px 6%;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
    }

    .game {
      background: #202020;
      border: 1px solid #333;
      border-radius: 15px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }

    .game:hover {
      transform: translateY(-5px);
      border-color: #777;
    }

    .preview {
      height: 190px;
      background:
        url('/games/dungeon/assets/maps/background.png')
        center / cover no-repeat;
    }

    .info {
      padding: 22px;
    }

    .info h2 {
      margin-bottom: 10px;
    }

    .info p {
      color: #aaa;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .play {
      display: inline-block;
      padding: 12px 22px;
      background: #fff;
      color: #111;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .play:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 StreetGames</h1>
  <p>Play games directly from the browser.</p>
</header>

<main>
  <h2 style="margin-bottom:25px;">Games</h2>

  <section class="games">

    <article class="game">
      <div class="preview"></div>

      <div class="info">
        <h2>⚔️ Dungeon Adventure</h2>

        <p>
          Explore the dungeon, fight slimes, collect rubies,
          and upgrade your sword.
        </p>

        <a class="play" href="/games/dungeon/">
          PLAY DUNGEON
        </a>
      </div>
    </article>

  </section>
</main>

</body>
</html>
