<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Robot3D - Level 1-2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game-container">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">

        <div class="hud-left">

            <div class="hud-item">
                🪙 <span id="coin-count">0</span>
            </div>

            <div class="hud-item">
                ❤️ <span id="lives">3</span>
            </div>

        </div>

        <div class="hud-center">
            <span>WORLD 1-2</span>
        </div>

        <div class="hud-right">
            <button id="pause-button">Ⅱ</button>
        </div>

    </div>


    <div id="start-screen">

        <div class="start-panel">

            <h1>WORLD 1-2</h1>

            <p>
                The enemies have arrived!
            </p>

            <button id="start-button">
                PLAY
            </button>

            <div class="controls">

                <p><b>A / D</b> — Move</p>

                <p><b>W / SPACE</b> — Jump</p>

                <p><b>X / CLICK</b> — Shoot</p>

            </div>

        </div>

    </div>


    <div id="pause-screen" class="hidden">

        <div class="pause-panel">

            <h2>GAME PAUSED</h2>

            <button id="resume-button">
                RESUME
            </button>

            <button id="restart-button">
                RESTART
            </button>

        </div>

    </div>


    <div id="game-over-screen" class="hidden">

        <div class="game-over-panel">

            <h2>GAME OVER</h2>

            <p>
                Coins:
                <span id="final-score">0</span>
            </p>

            <button id="retry-button">
                TRY AGAIN
            </button>

        </div>

    </div>

</div>

<script src="level1-2.js"></script>

</body>

</html>
