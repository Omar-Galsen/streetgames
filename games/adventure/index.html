<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Adventure - Level 1-1</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="hud">
        <div>❤️ Lives: <span id="lives">3</span></div>
        <div>🪙 Coins: <span id="coins">0</span></div>
        <div>⭐ Score: <span id="score">0</span></div>
        <div>🏁 Level 1-1</div>
    </div>

    <div id="message">
        <h1>STREET ADVENTURE</h1>
        <p>WASD / Arrow Keys = Move</p>
        <p>SPACE = Jump</p>
        <p>Collect coins and reach the flag!</p>
        <button id="startButton">START LEVEL</button>
    </div>

    <div id="levelComplete" class="hidden">
        <h1>🏆 LEVEL COMPLETE!</h1>
        <p>Great job!</p>
        <p>Coins: <span id="finalCoins">0</span></p>
        <p>Score: <span id="finalScore">0</span></p>
        <button onclick="location.reload()">PLAY AGAIN</button>
        <a href="/">STREETGAMES</a>
    </div>

    <div id="gameOver" class="hidden">
        <h1>💀 GAME OVER</h1>
        <p>Better luck next time!</p>
        <button onclick="location.reload()">TRY AGAIN</button>
        <a href="/">STREETGAMES</a>
    </div>

    <script type="module" src="game.js"></script>

</body>
</html>
