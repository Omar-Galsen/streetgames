<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreetGames</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

header{
    text-align:center;
    padding:40px 20px;
    background:#181818;
}

h1{
    font-size:42px;
    margin:0 0 10px;
}

main{
    max-width:1000px;
    margin:auto;
    padding:50px 20px;
}

.card{
    max-width:350px;
    margin:auto;
    background:#222;
    border:1px solid #444;
    border-radius:16px;
    overflow:hidden;
}

.preview{
    height:220px;
    background:#292929;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:90px;
}

.info{
    padding:25px;
}

.info h2{
    margin-top:0;
}

.info p{
    color:#aaa;
    line-height:1.5;
}

.play{
    display:inline-block;
    background:#fff;
    color:#111;
    padding:13px 22px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
    margin-top:10px;
}

.play:hover{
    background:#ddd;
}
</style>
</head>

<body>

<header>
    <h1>🎮 StreetGames</h1>
    <p>Play games directly in your browser.</p>
</header>

<main>

<div class="card">

    <div class="preview">🧙</div>

    <div class="info">
        <h2>🧙 Character</h2>

        <p>
            Enter the Character game and start playing.
        </p>

        <a class="play" href="/games/character/">
            PLAY CHARACTER
        </a>
    </div>

</div>

</main>

</body>
</html>
